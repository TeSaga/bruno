name: Build Windows Executable (.exe)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core Libraries
        run: |
          npm run build:bruno-common
          npm run build:schema-types
          npm run build:bruno-query
          npm run build:bruno-converters

      - name: Build Web App
        run: npm run build:web

      - name: Package Electron Windows (.exe)
        run: node scripts/build-electron.js

      - name: Upload .exe as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dopi-Windows-Installer
          path: packages/bruno-electron/out/*.exe
          retention-days: 14

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/bruno-electron/out/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
